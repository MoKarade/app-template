name: Essai de la relecture IA

# Workflow d'essai, retiré juste après (MoKarade/.github#97) : il ne se lance qu'à la main et appelle
# la fumée commune comme fumee.yml, avec le même secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fumee:
    name: Essai
    uses: MoKarade/.github/.github/workflows/fumee.yml@main
    with:
      url-base: https://app-template.hubperso.com
    secrets:
      hub-token: ${{ secrets.HUB_TOKEN }}
